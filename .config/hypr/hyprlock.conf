# hyprlock — screen locker for sway (ext-session-lock).
# Runs fingerprint (via fprintd over D-Bus) and password IN PARALLEL, so a
# swipe unlocks instantly while typing a password + Enter is instant and
# reliable — the thing swaylock's single serial PAM stack couldn't do.
# PAM stack for the password path lives in /etc/pam.d/hyprlock (password only;
# fingerprint must NOT be in PAM or it would serialise and block passwords).

general {
    hide_cursor = true
}

background {
    color = rgba(4c7899ff)
}

input-field {
    size = 320, 55
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.2
    fade_on_empty = false
    placeholder_text = <i>Password or fingerprint…</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -20
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] echo "$TIME"
    font_size = 48
    position = 0, 80
    halign = center
    valign = center
}

auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning…
    }
}
