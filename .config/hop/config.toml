workspace_layout = "tabbed"
debug_log = true

[keys]
open_selection = "alt+f"
preview = "shift"

[windows.llm]
command = "claude"
position = -1

[backends.starfish]
activate              = "test -d anonymiser-app"
prepare               = [
  "$HOME/projects/devcontainers/starfish/dc up",
  """hop bridge shim --socket /run/hop/api.sock \\
       | $HOME/projects/devcontainers/starfish/dc exec-T \\
         sudo install -m 755 /dev/stdin /usr/local/bin/hop""",
  """cat "$(command -v kitten)" \\
       | $HOME/projects/devcontainers/starfish/dc exec-T \\
         sudo install -m 755 /dev/stdin /usr/local/bin/kitten""",
]
teardown              = "$HOME/projects/devcontainers/starfish/dc down"
port_translate        = "$HOME/projects/devcontainers/starfish/dc port {port}"
host_translate        = "echo platform.localhost"
interactive_prefix    = "$HOME/projects/devcontainers/starfish/dc exec"
noninteractive_prefix = "$HOME/projects/devcontainers/starfish/dc exec-T"

[backends.kitty]
activate              = "grep -q '^module github.com/kovidgoyal/kitty$' go.mod 2>/dev/null"
prepare               = [
  "$HOME/projects/devcontainers/kitty/dc up",
  """hop bridge shim --socket /run/hop/api.sock \\
       | $HOME/projects/devcontainers/kitty/dc exec-T \\
         sudo install -m 755 /dev/stdin /usr/local/bin/hop""",
  """cat "$(command -v kitten)" \\
       | $HOME/projects/devcontainers/kitty/dc exec-T \\
         sudo install -m 755 /dev/stdin /usr/local/bin/kitten""",
]
teardown              = "$HOME/projects/devcontainers/kitty/dc down"
interactive_prefix    = "$HOME/projects/devcontainers/kitty/dc exec"
noninteractive_prefix = "$HOME/projects/devcontainers/kitty/dc exec-T"

# Matches every project not listed, so it must stay the last backend.
[backends.devcontainer]
activate              = """case "$PWD" in "$HOME/projects/dotfiles"|"$HOME/projects/artwall") false ;; esac"""
prepare               = [
  "$HOME/projects/dotfiles/devcontainer/up",
  """hop bridge shim --socket /run/hop/api.sock \\
       | $HOME/projects/dotfiles/devcontainer/compose exec -T devcontainer \\
         sudo install -m 755 /dev/stdin /usr/local/bin/hop""",
  """cat "$(command -v kitten)" \\
       | $HOME/projects/dotfiles/devcontainer/compose exec -T devcontainer \\
         sudo install -m 755 /dev/stdin /usr/local/bin/kitten""",
]
teardown              = "$HOME/projects/dotfiles/devcontainer/compose down"
interactive_prefix    = "$HOME/projects/dotfiles/devcontainer/compose exec devcontainer"
noninteractive_prefix = "$HOME/projects/dotfiles/devcontainer/compose exec -T devcontainer"
port_translate        = """
  podman ps -q \\
    --filter label=io.podman.compose.project=$(basename {session_root} | tr A-Z a-z | tr -cd a-z0-9_-) \\
    --filter label=io.podman.compose.service=devcontainer \\
    | head -1 \\
    | xargs -r -I@ podman port @ {port} \\
    | cut -d: -f2
"""

[layouts.rails]
activate = "test -f bin/rails"

[layouts.rails.windows.test]
command = "" # just starts an empty shell

[layouts.rails.windows.server]
command = "pkill -f '[f]oreman' 2>/dev/null; bin/dev"
env = { AUTO_SESSION_TIMEOUT = "false" }

[layouts.rails.windows.console]
command = "bin/rails console"

[layouts.rails.windows.log]
command = "less -R log/test.log"

[layouts.phoenix]
activate = "test -f mix.exs && grep -q ':phoenix,' mix.exs"

[layouts.phoenix.windows.test]
command = "" # just starts an empty shell

[layouts.phoenix.windows.server]
command = "pkill -f '[b]eam.*phx.server' 2>/dev/null; npm --prefix assets install && mix phx.server"

[layouts.phoenix.windows.console]
command = "iex -S mix"
