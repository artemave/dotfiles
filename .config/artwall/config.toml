# Where the published gallery is uploaded to. Inert — nothing here uploads or
# fetches anything; it only puts a link to the live site in your own gallery.
# Served by GitHub Actions from artemave/artwall-stars, publishing public/ as the
# site root (Pages' deploy-from-a-branch only ever offers / and /docs).
public_url = "https://artemave.github.io/artwall-stars/"
owner = "Artem"
