# Suspend on lid close, docked or not.
#
# The stock setting is HandleLidSwitchDocked=ignore, i.e. an attached external
# screen stops a lid close from suspending at all. That gap used to be filled by
# an acpid rule (/etc/acpi/events/laptop-lid: event=button/lid.* -> systemctl
# suspend), but `button/lid.*` matches lid *open* too, so opening the lid on an
# already-awake machine suspended it a few seconds later. logind does the whole
# job properly, so that rule is gone and this covers the docked case it existed
# for.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchDocked=suspend
HandleLidSwitchExternalPower=suspend
